apiVersion: v1 
kind: ConfigMap
metadata:
  name: auth-cm
  namespace: task-runner
  annotations:
    argocd.argoproj.io/sync-wave: "1" 
data:
  AUTH_DB: "auth-db"

---

apiVersion: v1 
kind: Service 
metadata:
  name: auth-mongodb-svc
  namespace: task-runner
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterIP: None
  selector:
    app: auth-mongodb
  ports:
    - port: 27017
      name: mongodb-default-port
            
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-mongodb
  namespace: task-runner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: auth-mongodb-svc
  selector:
    matchLabels:
      app: auth-mongodb
  replicas: 2 
  template:
    metadata:
      labels:
        app: auth-mongodb
    spec:
      containers:
        - name: auth-mongodb
          image: mongo:7.0
          # make it the part of the cluster
          command: ["mongod"]
          args: ["--replSet","rs0","--bind_ip_all"]
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: auth-cm
                  key: AUTH_DB

            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-mongodb
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-mongodb
                  key: MONGO_INITDB_ROOT_PASSWORD
            
                     
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 200M

---

apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: task-runner
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongo-init
        image: mongo:7.0
        command:
        - mongosh
        - --host
        - auth-mongodb-0.auth-mongodb-svc.task-runner.svc.cluster.local:27017
        - --eval
        - |
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: 'auth-mongodb-0.auth-mongodb-svc.task-runner.svc.cluster.local:27017' },
              { _id: 1, host: 'auth-mongodb-1.auth-mongodb-svc.task-runner.svc.cluster.local:27017' }
            ]
          })
            

